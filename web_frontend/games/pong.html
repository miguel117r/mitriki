<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Juego - Pong</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #pong-container { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        canvas { background: #000; border: 4px solid #fff; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .controls { color: #fff; background: #333; padding: 10px; margin-top: 10px; border-radius: 5px; text-align: center; }
        .mode-selector { margin-bottom: 10px; }
        button { padding: 8px 15px; margin: 0 5px; cursor: pointer; }
    </style>
</head>
<body style="background: #222;">
    <header>
        <h1 style="color: white;">Pong</h1>
        <a href="../index.html" style="color: #4caf50;">Volver al Menú</a>
    </header>
    <main id="pong-container">
        <div class="mode-selector">
            <button id="btn-ia">vs IA</button>
            <button id="btn-pvp">vs Jugador 2 (Local)</button>
        </div>
        <div id="game-status" style="color: white; margin-bottom: 10px; font-size: 20px;">Selecciona un modo para jugar</div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div class="controls">
            <p>Jugador 1: W / S | Jugador 2: ↑ / ↓</p>
        </div>
    </main>
    <script src="../js/pong.js"></script>
</body>
</html>
