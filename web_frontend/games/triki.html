<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triki Online & IA | Multi-Juego</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .triki-board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin-top: 20px; }
        .cell { width: 100px; height: 100px; background: #161b22; border: 2px solid #30363d; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-family: 'Orbitron', sans-serif; cursor: pointer; transition: 0.3s; color: #00ff88; }
        .cell:hover { border-color: #00ff88; transform: scale(1.05); }
        .setup-screen { display: flex; flex-direction: column; gap: 15px; max-width: 300px; margin-top: 50px; }
        .info-panel { margin-top: 20px; text-align: center; }
        input { padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 5px; }
        .btn-ia { background: #00d4ff; color: #0b0e14; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h1>TRIKI</h1>
    </header>

    <main style="display: flex; flex-direction: column; align-items: center;">
        <div id="setup" class="setup-screen">
            <button class="btn-ia" onclick="createAIGame()">🤖 Jugar contra la IA</button>
            <hr style="width: 100%; border: 0.5px solid #30363d;">
            <button onclick="createRoom()">➕ Crear Sala Privada</button>
            <div style="display: flex; gap: 5px;">
                <input type="text" id="room-input" placeholder="Código de sala">
                <button onclick="joinRoom()">Unirse</button>
            </div>
        </div>

        <div id="game-view" style="display: none;">
            <div class="info-panel">
                <p id="room-info" style="color: #00d4ff;"></p>
                <p id="turn-info" style="font-size: 24px; margin: 10px 0;"></p>
                <p id="scores" style="color: #8b949e;"></p>
            </div>
            <div class="triki-board" id="board"></div>
            <button id="restart-btn" style="margin-top: 20px; display: none;" onclick="restartGame()">Reiniciar Partida</button>
        </div>

        <a href="../index.html" class="play-button" style="margin-top: 30px; text-decoration: none;">Volver al Menú</a>
    </main>

    <script src="../js/online-triki.js"></script>
</body>
</html>
