<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Neón | Multi-Juego</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        #pong-container { display: flex; flex-direction: column; align-items: center; margin-top: 20px; }
        canvas { background: #0b0e14; border: 3px solid #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); max-width: 95%; height: auto; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; justify-content: center; }
        .difficulty-panel { margin-top: 10px; display: flex; gap: 10px; align-items: center; }
        select { background: #161b22; color: #00ff88; border: 1px solid #00ff88; padding: 5px 10px; border-radius: 5px; font-family: 'Orbitron', sans-serif; }
    </style>
</head>
<body>
    <header>
        <h1>PONG NEÓN</h1>
        <div class="difficulty-panel">
            <span style="color: #8b949e;">Dificultad:</span>
            <select id="difficulty-select">
                <option value="lento">Lento (Tranquilo)</option>
                <option value="normal" selected>Normal (Estándar)</option>
                <option value="rapido">Rápido (Desafío)</option>
            </select>
        </div>
    </header>
    <main id="pong-container">
        <div id="game-status" style="font-family: 'Orbitron', sans-serif; margin-bottom: 10px; min-height: 24px; font-size: 20px;">Selecciona un modo</div>
        <div class="controls">
            <button id="btn-ia">vs Computadora</button>
            <button id="btn-pvp" style="border-color: #00d4ff; color: #00d4ff;">2 Jugadores</button>
        </div>
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        <div style="color: #8b949e; margin-top: 15px; font-size: 0.8rem;">
            PC: W/S (P1) • Flechas (P2) | Móvil: Tocar lado de la paleta
        </div>
        <a href="../index.html" style="margin-top: 20px; color: #00ff88; text-decoration: none;">Volver al Menú</a>
    </main>
    <script src="../js/pong.js"></script>
</body>
</html>
